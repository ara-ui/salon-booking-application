<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glow Salon — Reset password</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/auth-extra.css" />
</head>
<body>
<header><h1>Glow Salon</h1></header>
<main class="auth-main">
  <div class="card">
    <h2>Reset your password</h2>
    <p class="auth-hint">Choose a new password below.</p>
    <form id="resetPasswordForm">
      <label>New password</label>
      <input type="password" id="rpPassword" required minlength="6" />
      <label>Confirm new password</label>
      <input type="password" id="rpConfirmPassword" required minlength="6" />
      <button type="submit">Reset password</button>
    </form>
    <p class="auth-back"><a href="/html/index.html">Back to login</a></p>
    <div id="msg"></div>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
