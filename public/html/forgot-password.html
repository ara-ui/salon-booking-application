<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glow Salon — Forgot password</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/auth-extra.css" />
</head>
<body>
<header><h1>Glow Salon</h1></header>
<main class="auth-main">
  <div class="card">
    <h2>Forgot your password?</h2>
    <p class="auth-hint">Enter the email on your account and, if it's registered, we'll send you a link to reset your password.</p>
    <form id="forgotPasswordForm">
      <label>Email</label>
      <input type="email" id="fpEmail" required />
      <button type="submit">Send reset link</button>
    </form>
    <p class="auth-back"><a href="/html/index.html">Back to login</a></p>
    <div id="msg"></div>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/forgot-password.js"></script>
</body>
</html>
