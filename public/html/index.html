<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glow Salon — Welcome</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/auth-extra.css" />
</head>
<body>
<header><h1>Glow Salon</h1></header>
<main class="auth-main">
  <div class="auth-brand">
    <p class="page-eyebrow">Welcome to Glow Salon</p>
    <h2>Look good. Feel good.</h2>
    <p>Book your next salon visit in a few simple steps.</p>
  </div>

  <div class="tabs" role="tablist" aria-label="Account access">
    <button id="tabLogin" class="active" type="button" role="tab">Sign in</button>
    <button id="tabRegister" type="button" role="tab">Create account</button>
  </div>

  <section class="card" id="loginCard">
    <h2>Welcome back</h2>
    <form id="loginForm" autocomplete="on">
      <label for="loginEmail">Email address</label>
      <input type="email" id="loginEmail" autocomplete="email" required />
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required />
      <button class="auth-submit" type="submit">Sign in</button>
    </form>
    <p class="auth-back"><a href="/html/forgot-password.html">Forgot your password?</a></p>
  </section>

  <section class="card" id="registerCard" style="display:none">
    <h2>Create your account</h2>
    <p class="auth-hint">Join Glow Salon to book appointments and manage your visits.</p>
    <form id="registerForm" autocomplete="on">
      <label for="regName">Full name</label>
      <input type="text" id="regName" autocomplete="name" maxlength="120" required />
      <label for="regEmail">Email address</label>
      <input type="email" id="regEmail" autocomplete="email" required />
      <label for="regPhone">Phone <span class="muted">(optional)</span></label>
      <input type="tel" id="regPhone" autocomplete="tel" maxlength="40" />
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" autocomplete="new-password" minlength="6" maxlength="128" required />
      <button class="auth-submit" type="submit">Create account</button>
    </form>
  </section>

  <div id="msg" aria-live="polite"></div>
</main>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
