<!DOCTYPE html>
<html lang="en">
<head>

<title>Glow Salon — Staff</title>

</head>
<body>
<header>
  <h1>Glow Salon — Staff</h1>
  <nav><span id="welcome"></span><span class="logout" onclick="logout()">Logout</span></nav>
</header>
<main>

  <div class="card">
    <h2>My upcoming appointments</h2>

      <thead><tr><th>Customer</th><th>Service</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="apptRows"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Reviews about me</h2>
    <div id="reviews"></div>
  </div>

</main>

<script src="../js/api.js"></script>
<script src="../js/staff.js"></script>

</html>
